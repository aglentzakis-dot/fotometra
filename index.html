<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ΦωτοΜέτρα">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>ΦωτοΜέτρα — σημειώσεις &amp; διαστάσεις σε φωτογραφίες</title>
<style>
:root{
  --bg:#eef1f5; --panel:#ffffff; --panel2:#f6f8fa; --txt:#12161b; --muted:#68707c;
  --line:#dfe4ea; --accent:#2f6df6; --accent-txt:#ffffff; --danger:#e0362c;
  --shadow:0 6px 24px rgba(15,23,42,.12); --canvasbg:#c9ced6;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1318; --panel:#171c23; --panel2:#1e242c; --txt:#eef2f7; --muted:#9aa4b2;
    --line:#2a313b; --accent:#5b8cff; --accent-txt:#0b1220; --danger:#ff6b60;
    --shadow:0 6px 24px rgba(0,0,0,.45); --canvasbg:#0a0d11;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1318; --panel:#171c23; --panel2:#1e242c; --txt:#eef2f7; --muted:#9aa4b2;
  --line:#2a313b; --accent:#5b8cff; --accent-txt:#0b1220; --danger:#ff6b60;
  --shadow:0 6px 24px rgba(0,0,0,.45); --canvasbg:#0a0d11;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
button{font-family:inherit;color:inherit}
#top{
  display:flex; align-items:center; gap:6px; padding:8px 10px;
  background:var(--panel); border-bottom:1px solid var(--line); flex:0 0 auto;
}
#top h1{font-size:15px;margin:0;font-weight:650;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{
  background:var(--panel2); border:1px solid var(--line); border-radius:10px;
  padding:7px 9px; font-size:12px; font-weight:600; cursor:pointer; display:flex;
  align-items:center; gap:5px; white-space:nowrap;
}
.tbtn:active{transform:scale(.96)}
.tbtn.primary{background:var(--accent);color:var(--accent-txt);border-color:transparent}
#stage{flex:1 1 auto; position:relative; background:var(--canvasbg); overflow:hidden; min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#empty{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:14px; padding:24px; text-align:center; background:var(--bg);
}
#empty p{margin:0;color:var(--muted);font-size:13px;line-height:1.55;max-width:320px}
#empty .big{font-size:17px;font-weight:700;color:var(--txt)}
#scaleTag{
  position:absolute; left:8px; top:8px; background:var(--panel); border:1px solid var(--line);
  border-radius:9px; padding:5px 9px; font-size:11px; font-weight:600; box-shadow:var(--shadow);
  display:flex; align-items:center; gap:6px; max-width:calc(100% - 16px);
}
#scaleTag.warn{color:var(--danger)}
#autoTag{position:absolute; right:8px; top:8px; background:var(--panel); border:1px solid var(--line);
  border-radius:9px; padding:4px 8px; font-size:10.5px; font-weight:600; opacity:0; transition:opacity .4s;
  pointer-events:none; box-shadow:var(--shadow)}
#zoomBox{position:absolute; right:8px; bottom:8px; display:flex; flex-direction:column; gap:6px}
#histBox{position:absolute; left:8px; bottom:8px; display:flex; gap:6px}
#histBox .zb{font-size:19px}
.zb.off{opacity:.35}
.zb{width:38px;height:38px;border-radius:12px;background:var(--panel);border:1px solid var(--line);
  box-shadow:var(--shadow);font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
#bottom{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);padding:6px 0 max(6px,env(safe-area-inset-bottom))}
#tools{display:flex;gap:4px;overflow-x:auto;padding:0 8px 4px;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
.tool{
  flex:0 0 auto; width:60px; padding:6px 2px; border-radius:12px; border:1px solid transparent;
  background:transparent; display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:10px; font-weight:600; cursor:pointer; color:var(--muted);
}
.tool svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tool.on{background:var(--accent);color:var(--accent-txt);border-color:transparent}
#opts{display:flex;align-items:center;gap:8px;padding:6px 10px 0;overflow-x:auto;scrollbar-width:none}
#opts::-webkit-scrollbar{display:none}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;cursor:pointer}
.sw.on{outline:2px solid var(--accent);outline-offset:2px}
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:var(--panel2);border-radius:999px;
  padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px
}
.chip.on{background:var(--accent);color:var(--accent-txt);border-color:transparent}
.sep{width:1px;height:22px;background:var(--line);flex:0 0 auto}
input[type=range]{width:78px;flex:0 0 auto;accent-color:var(--accent)}
#sheet{
  position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; z-index:40;
  align-items:flex-end; justify-content:center;
}
#sheet.show{display:flex}
#sheetIn{
  background:var(--panel); width:100%; max-width:560px; max-height:88vh; overflow:auto;
  border-radius:18px 18px 0 0; padding:14px 14px max(14px,env(safe-area-inset-bottom));
  box-shadow:var(--shadow);
}
#sheetIn h2{margin:0 0 10px;font-size:15px}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.num{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;flex:0 0 auto}
.rowmain{flex:1;min-width:0}
.rowmain b{font-size:13px;display:block}
.rowmain span{font-size:11.5px;color:var(--muted);display:block;word-break:break-word}
.mini{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:6px 8px;font-size:11px;font-weight:600;cursor:pointer}
.mini.del{color:var(--danger)}
label.fld{display:block;font-size:12px;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=number],textarea,select{
  width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel2);color:var(--txt);font-size:15px;font-family:inherit
}
textarea{min-height:84px;resize:vertical}
.acts{display:flex;gap:8px;margin-top:14px}
.acts button{flex:1;padding:11px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);font-size:13px;font-weight:700;cursor:pointer}
.acts button.primary{background:var(--accent);color:var(--accent-txt);border-color:transparent}
.hint{font-size:11.5px;color:var(--muted);line-height:1.5;margin:8px 0 0}
#toast{
  position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--txt);color:var(--bg);
  padding:9px 14px;border-radius:999px;font-size:12px;font-weight:600;opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:60;max-width:90%;text-align:center
}
#toast.show{opacity:.95}
ul.tips{margin:8px 0 0 16px;padding:0;font-size:12.5px;line-height:1.6;color:var(--muted)}
</style>
</head>
<body>

<div id="top">
  <h1>ΦωτοΜέτρα</h1>
  <button class="tbtn" id="bOpen">📷 Φωτογραφία</button>
  <button class="tbtn" id="bList">Λίστα</button>
  <button class="tbtn primary" id="bDone" style="display:none">✓ Τέλος</button>
  <button class="tbtn primary" id="bInstall" style="display:none">⤓ Εγκατάσταση</button>
  <button class="tbtn" id="bMenu">⋯</button>
</div>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="empty">
    <div class="big">Βάλε μια φωτογραφία για να ξεκινήσεις</div>
    <p>Τράβα ίσιες γραμμές, πάρε διαστάσεις σε πραγματικά μέτρα, βάλε σημειώσεις πάνω στην εικόνα και βγάλε την έτοιμη για αποστολή.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
      <button class="tbtn primary" id="bCam">📸 Κάμερα</button>
      <button class="tbtn" id="bFile">🗂️ Από αρχεία</button>
      <button class="tbtn" id="bSaved2">💾 Αποθηκευμένα</button>
    </div>
  </div>
  <div id="scaleTag" style="display:none"></div>
  <div id="autoTag">💾 αποθηκεύτηκε</div>
  <div id="histBox" style="display:none">
    <button class="zb" id="hUndo" title="Αναίρεση">↶</button>
    <button class="zb" id="hRedo" title="Επανάληψη">↷</button>
  </div>
  <div id="zoomBox" style="display:none">
    <button class="zb" id="zIn">+</button>
    <button class="zb" id="zOut">−</button>
    <button class="zb" id="zFit" style="font-size:12px">Fit</button>
  </div>
</div>

<div id="bottom">
  <div id="tools"></div>
  <div id="opts">
    <span id="swatches" style="display:flex;gap:6px"></span>
    <span class="sep"></span>
    <input type="range" id="wRange" min="1" max="10" step="1" value="3" title="πάχος">
    <span class="sep"></span>
    <button class="chip" id="cSnap">📐 Κλείδωμα γωνίας</button>
    <button class="chip" id="cShow">👁️ Σημάδια</button>
    <button class="chip" id="cTxt">📝 Κείμενο: κρυφό</button>
    <span class="sep"></span>
    <button class="chip" id="cEdit">✏️ Διάσταση / σχόλιο</button>
    <button class="chip" id="cDel">🗑️ Διαγραφή</button>
  </div>
</div>

<div id="sheet"><div id="sheetIn"></div></div>
<div id="toast"></div>
<input type="file" id="fCam" accept="image/*" capture="environment" style="display:none">
<input type="file" id="fFile" accept="image/*" style="display:none">
<input type="file" id="fBack" accept="application/json,.json" style="display:none">

<script>
"use strict";

/* ---------- παράμετροι ενσωμάτωσης (όταν τρέχει μέσα σε άλλη εφαρμογή) ---------- */
const QP=new URLSearchParams(location.search);
const EMBED=QP.get('embed')==='1';
const OWNER=QP.get('owner')||'';

/* ---------- κατάσταση ---------- */
const S = {
  owner:OWNER,
  img:null, blob:null, imgW:0, imgH:0,
  anns:[], sel:null, tool:'select',
  color:'#ff3b30', width:3, snap:false, show:true,
  scale:null,                 // {upp, unit}
  unit:'μ',                   // μονάδα εμφάνισης όταν δεν έχει οριστεί κλίμακα
  autoDev:false,            // αυτόματο γράψιμο αρχείου στο κινητό (μόνο με εφαρμογή Android)
  noteText:'hide',            // hide | short | full — πόσο κείμενο φαίνεται πάνω στην εικόνα
  view:{s:1,tx:0,ty:0},
  draft:null, undoS:[], redoS:[],
  projId:null, projName:'Χωρίς όνομα'
};
const COLORS=['#ff3b30','#ff9500','#ffd60a','#34c759','#0a84ff','#bf5af2','#ffffff','#111111'];
const UNITS=['μ','εκ','χιλ'];
const UNAME={'μ':'μέτρα','εκ':'εκατοστά','χιλ':'χιλιοστά'};
const UF={'μ':1,'εκ':0.01,'χιλ':0.001};
function setUnit(u){
  if(!UF[u])return;
  if(S.scale){ S.scale.upp=S.scale.upp*UF[S.scale.unit]/UF[u]; S.scale.unit=u; }
  S.unit=u; draw(); scaleTag();
}
let dl=null; // δυνατότητα αποθήκευσης αρχείου

/* ---------- εργαλεία ---------- */
const TOOLS=[
 {k:'select', n:'Επιλογή', i:'<path d="M5 3l13 7.5-5.5 1.4L10 20z"/>'},
 {k:'note',   n:'Σημείωση', i:'<path d="M20 5H4v11h4v4l5-4h7z"/>'},
 {k:'line',   n:'Μέτρηση', i:'<path d="M4 20L20 4"/><circle cx="4" cy="20" r="2"/><circle cx="20" cy="4" r="2"/>'},
 {k:'calib',  n:'Κλίμακα', i:'<path d="M3 12h18M6 9v6M12 9v6M18 9v6"/>'},
 {k:'rect',   n:'Ορθογώνιο', i:'<rect x="4" y="6" width="16" height="12" rx="1"/>'},
 {k:'poly',   n:'Πολύγωνο', i:'<path d="M4 17l4-9 6 4 6-7"/><circle cx="4" cy="17" r="1.6"/><circle cx="20" cy="5" r="1.6"/>'},
 {k:'angle',  n:'Γωνία', i:'<path d="M4 20h16M4 20L15 5"/><path d="M12 20a8 8 0 0 0-1.6-4.7"/>'},
 {k:'arrow',  n:'Βέλος', i:'<path d="M4 20L20 4M20 4h-7M20 4v7"/>'},
 {k:'free',   n:'Σχέδιο', i:'<path d="M3 16c3-8 6 5 9-2s4 3 9-3"/>'}
];
const TNAME={calib:'Κλίμακα',line:'Μήκος',rect:'Ορθογώνιο',poly:'Πολύγωνο',angle:'Γωνία',arrow:'Βέλος',note:'Σημείωση',free:'Σχέδιο'};

const LR=new Map();   // πλαίσια ετικετών (για πιάσιμο με το δάχτυλο)

/* ---------- στοιχεία ---------- */
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');

/* ---------- βοηθητικά ---------- */
const uid=()=>Math.random().toString(36).slice(2,9);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200);}
function trimN(v){const a=Math.abs(v); if(a>=100)return v.toFixed(0); if(a>=10)return v.toFixed(1); if(a>=1)return v.toFixed(2); return v.toFixed(3);}
function fmtLen(px){ if(!S.scale) return '0 '+S.unit; return trimN(px*S.scale.upp)+' '+S.scale.unit; }
function fmtArea(px2){ if(!S.scale) return '0 '+S.unit+'²'; return trimN(px2*S.scale.upp*S.scale.upp)+' '+S.scale.unit+'²'; }
function toScreen(p){return {x:p.x*S.view.s+S.view.tx, y:p.y*S.view.s+S.view.ty};}
function toImg(p){return {x:(p.x-S.view.tx)/S.view.s, y:(p.y-S.view.ty)/S.view.s};}

function polyLen(pts,closed){let L=0;for(let i=1;i<pts.length;i++)L+=dist(pts[i-1],pts[i]);if(closed&&pts.length>2)L+=dist(pts[pts.length-1],pts[0]);return L;}
function polyArea(pts){let a=0;for(let i=0,j=pts.length-1;i<pts.length;j=i++)a+=(pts[j].x+pts[i].x)*(pts[j].y-pts[i].y);return Math.abs(a/2);}
function angleOf(p){const [a,b,c]=p;const v1={x:a.x-b.x,y:a.y-b.y},v2={x:c.x-b.x,y:c.y-b.y};
  const d=(v1.x*v2.x+v1.y*v2.y)/((Math.hypot(v1.x,v1.y)||1)*(Math.hypot(v2.x,v2.y)||1));
  return Math.acos(Math.max(-1,Math.min(1,d)))*180/Math.PI;}

function noteMode(a,v){
  if(v!==S.view) return 'full';          // στην εξαγωγή φαίνονται όλα
  if(S.noteText==='full'||a.id===S.sel) return 'full';
  if(S.noteText==='short') return 'short';
  return 'none';
}
function shortTxt(t){ const l=(t||'').split('\n')[0]; return l.length>16?l.slice(0,16)+'…':l; }

function measureOf(a){
  if(a.man) return a.man;
  return autoMeasure(a);
}
function autoMeasure(a){
  if(a.type==='line'||a.type==='arrow'||a.type==='calib'){ if(a.pts.length<2)return ''; return fmtLen(dist(a.pts[0],a.pts[1])); }
  if(a.type==='rect'){ if(a.pts.length<2)return ''; const w=Math.abs(a.pts[1].x-a.pts[0].x), h=Math.abs(a.pts[1].y-a.pts[0].y);
    return fmtLen(w)+' × '+fmtLen(h)+'  ·  '+fmtArea(w*h); }
  if(a.type==='poly'){ if(a.pts.length<2)return ''; const per=polyLen(a.pts,a.closed);
    return (a.closed?'περίμετρος ':'μήκος ')+fmtLen(per)+(a.closed&&a.pts.length>2?'  ·  '+fmtArea(polyArea(a.pts)):''); }
  if(a.type==='angle'){ if(a.pts.length<3)return ''; return angleOf(a.pts).toFixed(1)+'°'; }
  return '';
}

/* ---------- ιστορικό ---------- */
function snap(){ return JSON.stringify({a:S.anns, sc:S.scale, u:S.unit}); }
function push(){ S.undoS.push(snap()); if(S.undoS.length>60)S.undoS.shift(); S.redoS.length=0; }
function restore(str){ const o=JSON.parse(str); S.anns=o.a; S.scale=o.sc; if(o.u)S.unit=o.u; S.sel=null; }
function undo(){ if(!S.undoS.length){toast('Δεν υπάρχει τίποτα για αναίρεση');return;} S.redoS.push(snap()); restore(S.undoS.pop()); draw(); scaleTag(); refreshOpts(); }
function redo(){ if(!S.redoS.length){toast('Δεν υπάρχει τίποτα για επανάληψη');return;} S.undoS.push(snap()); restore(S.redoS.pop()); draw(); scaleTag(); refreshOpts(); }

/* ---------- σχεδίαση ---------- */
function fitCanvas(){
  const r=$('stage').getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
  cv._w=r.width; cv._h=r.height; cv._dpr=dpr; draw();
}
function fitView(){
  if(!S.img)return;
  const s=Math.min(cv._w/S.imgW, cv._h/S.imgH)*0.96;
  S.view={s, tx:(cv._w-S.imgW*s)/2, ty:(cv._h-S.imgH*s)/2}; draw();
}
function zoomAt(cx,cy,f){
  const s2=Math.max(0.05,Math.min(40,S.view.s*f));
  S.view.tx = cx-(cx-S.view.tx)*(s2/S.view.s);
  S.view.ty = cy-(cy-S.view.ty)*(s2/S.view.s);
  S.view.s=s2; draw();
}

function draw(){
  ctx.setTransform(cv._dpr||1,0,0,cv._dpr||1,0,0);
  ctx.clearRect(0,0,cv._w||0,cv._h||0);
  if(!S.img)return;
  const v=S.view;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(S.img, v.tx, v.ty, S.imgW*v.s, S.imgH*v.s);
  if(!S.show)return;
  LR.clear();
  const list=S.draft?S.anns.concat([S.draft]):S.anns;
  list.forEach((a,i)=>drawAnn(ctx,a,v,1,a.id===S.sel));
}

function drawAnn(c,a,v,k,selected){
  const P=a.pts.map(p=>({x:p.x*v.s+v.tx, y:p.y*v.s+v.ty}));
  if(!P.length)return;
  const w=(a.width||3)*k;
  c.save();
  c.lineCap='round'; c.lineJoin='round';
  c.strokeStyle=a.color; c.fillStyle=a.color;
  c.lineWidth=w+2*k; c.globalAlpha=.35; c.strokeStyle='#000';
  if(a.type!=='note') strokePath(c,a,P,k);
  c.globalAlpha=1; c.strokeStyle=a.color; c.lineWidth=w;
  strokePath(c,a,P,k);

  const idx=S.anns.indexOf(a);
  const n=idx>=0?idx+1:S.anns.length+1;

  if(a.type==='note'){
    const pr=drawPin(c,P[0],n,a,k,v,noteMode(a,v));
    if(v===S.view&&pr)LR.set(a.id,pr);
  }else{
    const m=measureOf(a);
    const nm=noteMode(a,v);
    let ntxt='';
    if(a.note){ ntxt = nm==='full'?a.note : nm==='short'?shortTxt(a.note) : '💬'; }
    const txt=(m?m:'')+(ntxt?(m?'  ·  ':'')+ntxt:'');
    if(txt){
      const pos=labelPos(a,P);
      if(a.lo){ pos.x+=a.lo.x*v.s; pos.y+=a.lo.y*v.s; }
      const r=drawLabel(c,pos,txt,a.color,k);
      if(v===S.view)LR.set(a.id,r);
      if(a.lo&&(Math.abs(a.lo.x)+Math.abs(a.lo.y))*v.s>18){
        c.save(); c.setLineDash([3*k,3*k]); c.globalAlpha=.6; c.lineWidth=1.2*k; c.strokeStyle=a.color;
        c.beginPath(); c.moveTo(labelPos(a,P).x, labelPos(a,P).y); c.lineTo(r.x+r.w/2, r.y+r.h); c.stroke(); c.restore();
      }
    }
  }
  if(selected){
    c.setLineDash([4*k,4*k]); c.strokeStyle='#fff'; c.lineWidth=1.5*k; c.globalAlpha=.9;
    P.forEach(p=>{c.beginPath();c.arc(p.x,p.y,7*k,0,7);c.stroke();});
    c.setLineDash([]);
    c.fillStyle='#fff'; c.globalAlpha=1;
    P.forEach(p=>{c.beginPath();c.arc(p.x,p.y,4.5*k,0,7);c.fill();});
  }
  c.restore();
}

function strokePath(c,a,P,k){
  const w=(a.width||3)*k;
  c.beginPath();
  if(a.type==='rect'){
    if(P.length<2)return;
    c.rect(Math.min(P[0].x,P[1].x),Math.min(P[0].y,P[1].y),Math.abs(P[1].x-P[0].x),Math.abs(P[1].y-P[0].y));
    c.stroke(); tickEnds(c,a,P,k); return;
  }
  c.moveTo(P[0].x,P[0].y);
  for(let i=1;i<P.length;i++)c.lineTo(P[i].x,P[i].y);
  if(a.type==='poly'&&a.closed&&P.length>2)c.closePath();
  c.stroke();
  if(a.type==='arrow'&&P.length>1)arrowHead(c,P[P.length-2],P[P.length-1],w);
  if(a.type==='line'||a.type==='calib')tickEnds(c,a,P,k);
  if(a.type==='angle'&&P.length>=3)arcMark(c,P,k);
}
function tickEnds(c,a,P,k){
  if(a.type==='rect')return;
  if(P.length<2)return;
  const ang=Math.atan2(P[1].y-P[0].y,P[1].x-P[0].x)+Math.PI/2, L=7*k;
  [P[0],P[1]].forEach(p=>{c.beginPath();
    c.moveTo(p.x-Math.cos(ang)*L,p.y-Math.sin(ang)*L);
    c.lineTo(p.x+Math.cos(ang)*L,p.y+Math.sin(ang)*L); c.stroke();});
}
function arrowHead(c,p0,p1,w){
  const ang=Math.atan2(p1.y-p0.y,p1.x-p0.x), L=Math.max(10,w*3.4);
  c.beginPath(); c.moveTo(p1.x,p1.y);
  c.lineTo(p1.x-Math.cos(ang-0.45)*L, p1.y-Math.sin(ang-0.45)*L);
  c.lineTo(p1.x-Math.cos(ang+0.45)*L, p1.y-Math.sin(ang+0.45)*L);
  c.closePath(); c.fill();
}
function arcMark(c,P,k){
  const b=P[1], r=Math.min(30*k, dist(P[0],b)*0.5, dist(P[2],b)*0.5);
  const a1=Math.atan2(P[0].y-b.y,P[0].x-b.x), a2=Math.atan2(P[2].y-b.y,P[2].x-b.x);
  let d=a2-a1; while(d<-Math.PI)d+=2*Math.PI; while(d>Math.PI)d-=2*Math.PI;
  c.beginPath(); c.arc(b.x,b.y,r,a1,a1+d,d<0); c.stroke();
}
function labelPos(a,P){
  if(a.type==='rect'){const x=(P[0].x+P[1].x)/2, y=Math.min(P[0].y,P[1].y); return {x,y:y-4};}
  if(a.type==='angle'&&P.length>=3)return {x:P[1].x, y:P[1].y-10};
  if(a.type==='poly'){let sx=0,sy=0;P.forEach(p=>{sx+=p.x;sy+=p.y});return {x:sx/P.length,y:sy/P.length};}
  if(P.length>1)return {x:(P[0].x+P[1].x)/2, y:(P[0].y+P[1].y)/2-6};
  return {x:P[0].x,y:P[0].y-6};
}
function drawLabel(c,pos,txt,color,k){
  const fs=13*k; c.font='600 '+fs+'px -apple-system,Segoe UI,Roboto,sans-serif';
  const lines=wrap(c,txt,260*k); const wmax=Math.max(...lines.map(l=>c.measureText(l).width));
  const padX=7*k,padY=5*k, h=lines.length*fs*1.25+padY*2, w=wmax+padX*2;
  let x=pos.x-w/2, y=pos.y-h;
  c.globalAlpha=.92; c.fillStyle='#000'; roundRect(c,x,y,w,h,7*k); c.fill();
  c.globalAlpha=1; c.strokeStyle=color; c.lineWidth=1.5*k; roundRect(c,x,y,w,h,7*k); c.stroke();
  c.fillStyle='#fff'; c.textBaseline='top';
  lines.forEach((l,i)=>c.fillText(l,x+padX,y+padY+i*fs*1.25));
  return {x,y,w,h};
}
function drawPin(c,p,n,a,k,v,nm){
  const r=13*k;
  c.beginPath(); c.arc(p.x,p.y,r,0,7); c.fillStyle=a.color; c.fill();
  c.lineWidth=2*k; c.strokeStyle='#fff'; c.stroke();
  c.fillStyle='#fff'; c.font='700 '+(13*k)+'px -apple-system,Segoe UI,Roboto,sans-serif';
  c.textAlign='center'; c.textBaseline='middle'; c.fillText(String(n),p.x,p.y+0.5*k);
  c.textAlign='left';
  if(a.note){
    if(nm==='none'){
      c.beginPath(); c.arc(p.x+r*0.78,p.y-r*0.78,4*k,0,7); c.fillStyle='#fff'; c.fill();
      c.lineWidth=1.4*k; c.strokeStyle=a.color; c.stroke();
      return null;
    }
    const pos={x:p.x+(a.lo?a.lo.x*v.s:0), y:p.y-r-4*k+(a.lo?a.lo.y*v.s:0)};
    return drawLabel(c,pos, nm==='short'?shortTxt(a.note):a.note, a.color,k);
  }
  return null;
}
function wrap(c,t,max){
  const out=[]; t.split('\n').forEach(par=>{
    const ws=par.split(' '); let cur='';
    ws.forEach(w=>{ const tst=cur?cur+' '+w:w;
      if(c.measureText(tst).width>max&&cur){out.push(cur);cur=w;} else cur=tst; });
    out.push(cur);
  }); return out;
}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

/* ---------- χειρισμός αγγίγματος ---------- */
const ptrs=new Map();
let mode=null, start=null, startView=null, dragTarget=null, pinchD=0, pinchC=null, moved=false;
let lpT=null, lpFired=false;

function armLongPress(p){
  clearTimeout(lpT); lpFired=false;
  const q={...p};
  lpT=setTimeout(()=>{
    const h=hitTest(q); if(!h)return;
    S.draft=null; lpFired=true; moved=false;
    S.sel=h.a.id; dragTarget=h; mode='drag'; start=q; startView={...S.view};
    push();
    if(navigator.vibrate)navigator.vibrate(25);
    toast('Σύρε για μετακίνηση · άσε το για επεξεργασία');
    draw(); refreshOpts();
  },800);
}
function cancelLongPress(){ clearTimeout(lpT); }

cv.addEventListener('pointerdown',e=>{
  if(!S.img)return;
  cv.setPointerCapture(e.pointerId);
  const r=cv.getBoundingClientRect();
  ptrs.set(e.pointerId,{x:e.clientX-r.left,y:e.clientY-r.top});
  moved=false;
  if(ptrs.size===2){ S.draft=null; mode='pinch'; const a=[...ptrs.values()];
    pinchD=dist(a[0],a[1]); pinchC={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}; startView={...S.view}; draw(); return; }
  if(ptrs.size>2)return;
  start=[...ptrs.values()][0]; startView={...S.view};
  const ip=toImg(start);
  armLongPress(start);
  if(S.tool==='select'){
    const hit=hitTest(start);
    if(hit){ S.sel=hit.a.id; dragTarget=hit; mode='drag'; push(); }
    else { S.sel=null; mode='pan'; }
    draw(); refreshOpts(); return;
  }
  if(S.tool==='poly'||S.tool==='angle'||S.tool==='note'){ mode='tap'; return; }
  // εργαλεία με σύρσιμο
  mode='draw';
  S.draft={id:uid(),type:S.tool,pts:[ip,ip],color:S.color,width:S.width,note:''};
  if(S.tool==='free')S.draft.pts=[ip];
  draw();
});

cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const r=cv.getBoundingClientRect();
  const p={x:e.clientX-r.left,y:e.clientY-r.top};
  ptrs.set(e.pointerId,p);
  if(mode==='pinch'&&ptrs.size>=2){
    const a=[...ptrs.values()]; const d=dist(a[0],a[1]); const c={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
    const f=d/(pinchD||1);
    const s2=Math.max(0.05,Math.min(40,startView.s*f));
    S.view.s=s2;
    S.view.tx=c.x-((pinchC.x-startView.tx)/startView.s)*s2;
    S.view.ty=c.y-((pinchC.y-startView.ty)/startView.s)*s2;
    draw(); return;
  }
  if(dist(p,start||p)>5){ moved=true; if(!lpFired)cancelLongPress(); }
  if(mode==='pan'||(mode==='tap'&&moved)){
    S.view.tx=startView.tx+(p.x-start.x); S.view.ty=startView.ty+(p.y-start.y); draw(); return;
  }
  if(mode==='drag'&&dragTarget){
    const d={x:(p.x-start.x)/S.view.s, y:(p.y-start.y)/S.view.s};
    const a=dragTarget.a;
    if(dragTarget.h===-2){ a.lo={x:(dragTarget.lo.x||0)+d.x, y:(dragTarget.lo.y||0)+d.y}; }
    else if(dragTarget.h>=0){ a.pts[dragTarget.h]={x:dragTarget.orig[dragTarget.h].x+d.x, y:dragTarget.orig[dragTarget.h].y+d.y}; }
    else a.pts=dragTarget.orig.map(q=>({x:q.x+d.x,y:q.y+d.y}));
    draw(); return;
  }
  if(mode==='draw'&&S.draft){
    let ip=toImg(p);
    if(S.draft.type==='free'){ S.draft.pts.push(ip); }
    else { if(S.snap&&S.draft.type!=='rect')ip=snapAngle(S.draft.pts[0],ip); S.draft.pts[1]=ip; }
    draw(); return;
  }
});

function endPtr(e){
  if(!ptrs.has(e.pointerId))return;
  const r=cv.getBoundingClientRect();
  const p={x:e.clientX-r.left,y:e.clientY-r.top};
  ptrs.delete(e.pointerId);
  cancelLongPress();
  if(mode==='pinch'){ if(ptrs.size<2){mode=null;} return; }
  if(mode==='drag'&&lpFired){
    const a=dragTarget?dragTarget.a:null; const wasMoved=moved;
    mode=null; dragTarget=null; lpFired=false;
    if(a&&!wasMoved) editAnn(a);
    return;
  }
  if(mode==='draw'&&S.draft){
    const d=S.draft; S.draft=null;
    const ok = d.type==='free' ? d.pts.length>2 : dist(d.pts[0],d.pts[1])>4/S.view.s;
    if(ok){
      push();
      if(d.type==='calib'){ S.anns=S.anns.filter(a=>a.type!=='calib'); S.anns.push(d); S.sel=d.id; draw(); askCalib(d); }
      else { S.anns.push(d); S.sel=d.id; draw(); }
      refreshOpts();
    } else draw();
  }
  else if(mode==='tap'&&!moved){ handleTap(toImg(p)); }
  mode=null; dragTarget=null;
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{ if(!S.img)return; e.preventDefault();
  const r=cv.getBoundingClientRect(); zoomAt(e.clientX-r.left,e.clientY-r.top, e.deltaY<0?1.12:1/1.12); },{passive:false});

function snapAngle(p0,p1){
  const dx=p1.x-p0.x, dy=p1.y-p0.y, L=Math.hypot(dx,dy);
  const st=Math.PI/4, a=Math.round(Math.atan2(dy,dx)/st)*st;
  return {x:p0.x+Math.cos(a)*L, y:p0.y+Math.sin(a)*L};
}

function handleTap(ip){
  if(S.tool==='note'){
    const h=hitTest(toScreen(ip));
    if(h&&h.a.type==='note'){ S.sel=h.a.id; draw(); refreshOpts(); editAnn(h.a); return; }
    push();
    const a={id:uid(),type:'note',pts:[ip],color:S.color,width:S.width,note:''};
    S.anns.push(a); S.sel=a.id; draw(); editNote(a,true); return;
  }
  let cur=S.anns.find(a=>a.id===S.sel && a._open);
  if(!cur){
    push();
    cur={id:uid(),type:S.tool,pts:[],color:S.color,width:S.width,note:'',_open:true,closed:false};
    S.anns.push(cur); S.sel=cur.id;
  }
  let pt=ip;
  if(S.snap&&cur.pts.length)pt=snapAngle(cur.pts[cur.pts.length-1],ip);
  cur.pts.push(pt);
  if(S.tool==='angle'&&cur.pts.length>=3){ delete cur._open; }
  draw(); refreshOpts();
}
function finishPoly(){
  const cur=S.anns.find(a=>a._open); if(!cur)return;
  delete cur._open;
  if(cur.pts.length<2)S.anns=S.anns.filter(a=>a!==cur);
  draw(); refreshOpts();
}
function closePoly(){
  const cur=S.anns.find(a=>a._open)||S.anns.find(a=>a.id===S.sel&&a.type==='poly');
  if(!cur)return; cur.closed=!cur.closed; delete cur._open; draw(); refreshOpts();
}

function hitTest(sp){
  const tol=14;
  for(let i=S.anns.length-1;i>=0;i--){
    const a=S.anns[i]; const r=LR.get(a.id);
    if(r&&sp.x>r.x-6&&sp.x<r.x+r.w+6&&sp.y>r.y-6&&sp.y<r.y+r.h+6)
      return {a,h:-2,orig:a.pts.map(q=>({...q})),lo:{...(a.lo||{x:0,y:0})}};
  }
  for(let i=S.anns.length-1;i>=0;i--){
    const a=S.anns[i]; const P=a.pts.map(toScreen);
    for(let h=0;h<P.length;h++) if(dist(sp,P[h])<tol) return {a,h,orig:a.pts.map(q=>({...q}))};
    if(a.type==='note'){ if(dist(sp,P[0])<18) return {a,h:-1,orig:a.pts.map(q=>({...q}))}; continue; }
    if(a.type==='rect'&&P.length>1){
      const x0=Math.min(P[0].x,P[1].x),x1=Math.max(P[0].x,P[1].x),y0=Math.min(P[0].y,P[1].y),y1=Math.max(P[0].y,P[1].y);
      const near=(sp.x>x0-tol&&sp.x<x1+tol&&sp.y>y0-tol&&sp.y<y1+tol)&&
                 (Math.abs(sp.x-x0)<tol||Math.abs(sp.x-x1)<tol||Math.abs(sp.y-y0)<tol||Math.abs(sp.y-y1)<tol);
      if(near) return {a,h:-1,orig:a.pts.map(q=>({...q}))};
      continue;
    }
    for(let j=1;j<P.length;j++) if(segDist(sp,P[j-1],P[j])<tol) return {a,h:-1,orig:a.pts.map(q=>({...q}))};
    if(a.closed&&P.length>2&&segDist(sp,P[P.length-1],P[0])<tol) return {a,h:-1,orig:a.pts.map(q=>({...q}))};
  }
  return null;
}
function segDist(p,a,b){
  const dx=b.x-a.x, dy=b.y-a.y, L=dx*dx+dy*dy;
  if(!L)return dist(p,a);
  let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/L; t=Math.max(0,Math.min(1,t));
  return dist(p,{x:a.x+t*dx,y:a.y+t*dy});
}

function manUnit(a){ return ['χιλ','εκ','μ'].find(u=>(a.man||'').includes(u)) || (S.scale?S.scale.unit:S.unit); }

    const num=parseFloat((v.replace(',','.').match(/-?\d+(\.\d+)?/)||[''])[0]);
    if(fix&&num>0){
      S.scale={upp:num/dist(a.pts[0],a.pts[1]), unit:un};
      S.unit=un; a.man=''; scaleTag(); toast('Η κλίμακα διορθώθηκε — μπήκαν σωστά όλες οι μετρήσεις');
    } else {
      a.man = v ? (v+' '+un) : '';
      if(v&&!S.scale)S.unit=un;
    }
    closeSheet(); draw();
  };
}

/* ---------- φόρτωση εικόνας ---------- */
function loadBlob(b){
  const url=URL.createObjectURL(b); const im=new Image();
  im.onload=()=>{
    const MAX=3200; let w=im.naturalWidth,h=im.naturalHeight;
    if(Math.max(w,h)>MAX){
      const f=MAX/Math.max(w,h); const c2=document.createElement('canvas');
      c2.width=Math.round(w*f); c2.height=Math.round(h*f);
      c2.getContext('2d').drawImage(im,0,0,c2.width,c2.height);
      const im2=new Image();
      im2.onload=()=>{ URL.revokeObjectURL(url); setImage(im2,b); };
      im2.src=c2.toDataURL('image/jpeg',0.92);
      return;
    }
    setImage(im,b);
  };
  im.onerror=()=>toast('Δεν άνοιξε η εικόνα');
  im.src=url;
}
function setImage(im,blob){
  S.img=im; S.blob=blob; S.imgW=im.naturalWidth||im.width; S.imgH=im.naturalHeight||im.height;
  S.anns=[]; S.sel=null; S.scale=null; S.undoS=[]; S.redoS=[];
  S.projId=null; S.projName='Εργασία '+new Date().toLocaleDateString('el-GR')+' '+new Date().toLocaleTimeString('el-GR',{hour:'2-digit',minute:'2-digit'});
  lastSaved=null;
  $('empty').style.display='none'; $('zoomBox').style.display='flex'; $('histBox').style.display='flex';
  fitView(); scaleTag(); refreshOpts();
}
function scaleTag(){
  const t=$('scaleTag');
  if(!S.img){t.style.display='none';return;}
  t.style.display='flex';
  if(S.scale){ t.className=''; t.innerHTML='📐 Κλίμακα: 1 εικ. = '+trimN(S.scale.upp)+' '+S.scale.unit; }
  else { t.className='warn'; t.innerHTML='Χωρίς κλίμακα — οι μετρήσεις βγαίνουν 0 '+S.unit+', γράψ\' τες εσύ'; }
  t.onclick=()=>{ setTool('calib'); toast('Τράβα γραμμή σε κάτι με γνωστό μήκος'); };
}

/* ---------- γέφυρα προς μελλοντική εφαρμογή Android ----------
   Όταν η ΦωτοΜέτρα τυλιχτεί σε κανονική εφαρμογή Android, το περιτύλιγμα
   αρκεί να δημοσιεύσει ένα αντικείμενο window.FotoMetraNative με:
       saveFile(name, base64, mime)   -> γράφει αρχείο σε φάκελο του κινητού
       folder                         -> (προαιρετικό) όνομα φακέλου
   Τίποτα άλλο μέσα στην εφαρμογή δεν χρειάζεται αλλαγή: όλες οι
   αποθηκεύσεις περνούν ήδη από το saveToDevice() παρακάτω.
------------------------------------------------------------------- */
function native(){ return (typeof window!=='undefined'&&window.FotoMetraNative&&typeof window.FotoMetraNative.saveFile==='function')?window.FotoMetraNative:null; }
function blobB64(b){ return new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(String(f.result).split(',')[1]); f.readAsDataURL(b); }); }
function b64Blob(s,t){ const bin=atob(s), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return new Blob([u],{type:t||'application/octet-stream'}); }

async function saveToDevice(name,blob,quiet){
  const N=native();
  if(N){ try{ await N.saveFile(name, await blobB64(blob), blob.type||'application/octet-stream'); if(!quiet)toast('Αποθηκεύτηκε στο κινητό'); return true; }catch(e){} }
  if(quiet)return false;
  try{
    const f=new File([blob],name,{type:blob.type||'application/octet-stream'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:name}); return true; }
  }catch(e){ if(e&&e.name==='AbortError')return false; }
  saveFile(name,blob); return true;
}

/* ---------- εξαγωγή ---------- */
function renderFull(){
  const c=document.createElement('canvas'); c.width=S.imgW; c.height=S.imgH;
  const x=c.getContext('2d'); x.drawImage(S.img,0,0,S.imgW,S.imgH);
  const k=Math.max(1,Math.min(6,S.imgW/900));
  const v={s:1,tx:0,ty:0};
  S.anns.forEach(a=>drawAnn(x,a,v,k,false));
  return c;
}
async function saveFile(name,data){
  try{
    if(!dl) dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
  }catch(_){ dl=null; }
  if(dl){
    try{ await dl.save({filename:name,data}); toast('Αποθηκεύτηκε'); }
    catch(err){ if(err&&err.code==='declined')return; toast('Δεν έγινε η αποθήκευση'); }
    return;
  }
  const blob = data instanceof Blob ? data : new Blob([data]);
  const u=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),4000);
}
function pngName(){ return ((S.projName||'fotometra').replace(/[^\p{L}\p{N} _-]/gu,'').trim()||'fotometra')+'.png'; }
async function sharePng(quiet){
  if(!S.img)return;
  const b=await new Promise(r=>renderFull().toBlob(r,'image/png'));
  if(b) await saveToDevice(pngName(),b,quiet);
}

/* ---------- εφεδρικό αντίγραφο όλων ---------- */
async function backupAll(){
  try{
    toast('Ετοιμάζεται το αντίγραφο…');
    const d=await db();
    const all=await new Promise((res,rej)=>{ const t=d.transaction('p','readonly'); const q=t.objectStore('p').getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>rej(q.error); });
    const out={app:'fotometra',v:1,date:Date.now(),items:[]};
    for(const r of all) out.items.push({id:r.id,name:r.name,date:r.date,anns:r.anns,scale:r.scale,unit:r.unit,owner:r.owner||'',mime:(r.blob&&r.blob.type)||'image/jpeg',img:r.blob?await blobB64(r.blob):null});
    const d2=new Date(), st=d2.getFullYear()+('0'+(d2.getMonth()+1)).slice(-2)+('0'+d2.getDate()).slice(-2);
    await saveToDevice('fotometra-antigrafo-'+st+'.json', new Blob([JSON.stringify(out)],{type:'application/json'}));
  }catch(e){ toast('Δεν έγινε το αντίγραφο'); }
}
async function restoreAll(file){
  try{
    const o=JSON.parse(await file.text());
    if(!o||o.app!=='fotometra'||!Array.isArray(o.items)){ toast('Δεν είναι αρχείο ΦωτοΜέτρα'); return; }
    const d=await db();
    await new Promise((res,rej)=>{ const t=d.transaction('p','readwrite'); const st=t.objectStore('p');
      o.items.forEach(r=>st.put({id:r.id,name:r.name,date:r.date,anns:r.anns||[],scale:r.scale||null,unit:r.unit||'μ',owner:r.owner||'',blob:r.img?b64Blob(r.img,r.mime):null}));
      t.oncomplete=res; t.onerror=()=>rej(t.error); });
    toast('Επαναφέρθηκαν '+o.items.length+' εργασίες');
  }catch(e){ toast('Δεν διαβάστηκε το αρχείο'); }
}
function exportPng(){
  if(!S.img)return;
  renderFull().toBlob(b=>{ if(b)saveFile('fotometra-'+Date.now()+'.png',b); },'image/png');
}
function exportCsv(){
  if(!S.anns.length){toast('Δεν υπάρχουν μετρήσεις');return;}
  const lines=[['Αρ.','Τύπος','Μέτρηση','Σχόλιο'].join(';')];
  S.anns.forEach((a,i)=>lines.push([i+1,TNAME[a.type]||a.type,(measureOf(a)||'').replace(/;/g,','),(a.note||'').replace(/;/g,',').replace(/\n/g,' ')].join(';')));
  if(S.scale)lines.push(['','Κλίμακα','1 εικ. = '+trimN(S.scale.upp)+' '+S.scale.unit,''].join(';'));
  saveFile('metriseis-'+Date.now()+'.csv','\ufeff'+lines.join('\n'));
}

/* ---------- αποθήκευση έργων (τοπικά στη συσκευή) ---------- */
function db(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('fotometra',1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains('p'))r.result.createObjectStore('p',{keyPath:'id'}); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
let lastSaved=null, autoBusy=false;
async function autoSave(){
  if(!S.img||autoBusy)return;
  const sig=S.projName+'|'+snap();
  if(sig===lastSaved)return;
  autoBusy=true;
  try{
    const d=await db();
    if(!S.projId)S.projId=uid();
    let blob=S.blob;
    if(!blob) blob=await new Promise(r=>renderFull().toBlob(r,'image/jpeg',0.9));
    const rec={id:S.projId,name:S.projName,date:Date.now(),blob,anns:S.anns,scale:S.scale,unit:S.unit,owner:S.owner};
    await new Promise((res,rej)=>{ const t=d.transaction('p','readwrite'); t.objectStore('p').put(rec); t.oncomplete=res; t.onerror=()=>rej(t.error); });
    try{ localStorage.setItem('fotometra-last:'+S.owner,S.projId); }catch(_){}
    lastSaved=sig;
    if(S.autoDev&&native()) sharePng(true);
    const b=$('autoTag'); if(b){ b.textContent='💾 αποθηκεύτηκε'; b.style.opacity=1; setTimeout(()=>{b.style.opacity=0;},1400); }
  }catch(e){}
  autoBusy=false;
}
setInterval(autoSave,2500);
window.addEventListener('pagehide',()=>{autoSave();});
document.addEventListener('visibilitychange',()=>{ if(document.hidden)autoSave(); });

async function restoreLast(){
  let id=null; try{ id=localStorage.getItem('fotometra-last:'+S.owner); }catch(_){}
  if(!id)return;
  try{
    const d=await db();
    const r=await new Promise((res,rej)=>{ const t=d.transaction('p','readonly'); const q=t.objectStore('p').get(id); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); });
    if(!r||!r.blob)return;
    const im=new Image();
    im.onload=()=>{ setImage(im,r.blob); S.anns=r.anns||[]; S.scale=r.scale||null; S.unit=r.unit||S.unit; S.projId=r.id; S.projName=r.name;
      lastSaved=S.projName+'|'+snap(); draw(); scaleTag(); toast('Συνεχίζεις από εκεί που έμεινες'); };
    im.src=URL.createObjectURL(r.blob);
  }catch(e){}
}

async function saveProject(){
  if(!S.img){toast('Δεν υπάρχει φωτογραφία');return;}
  openSheet(`<h2>Αποθήκευση έργου</h2>
    <label class="fld">Όνομα</label>
    <input type="text" id="pN" value="${S.projName.replace(/"/g,'')}" placeholder="π.χ. Σαλόνι - τοίχος Β">
    <div class="acts"><button id="pC">Άκυρο</button><button class="primary" id="pS">Αποθήκευση</button></div>
    <p class="hint">Μένει μόνο στη συσκευή σου, σε αυτόν τον φυλλομετρητή.</p>`);
  $('pC').onclick=closeSheet;
  $('pS').onclick=async()=>{
    const name=($('pN').value||'Χωρίς όνομα').trim();
    try{
      const d=await db();
      const id=S.projId||uid();
      let blob=S.blob;
      if(!blob) blob=await new Promise(r=>renderFull().toBlob(r,'image/jpeg',0.9));
      const rec={id,name,date:Date.now(),blob,anns:S.anns,scale:S.scale,unit:S.unit,owner:S.owner};
      await new Promise((res,rej)=>{ const t=d.transaction('p','readwrite'); t.objectStore('p').put(rec); t.oncomplete=res; t.onerror=()=>rej(t.error); });
      S.projId=id; S.projName=name; closeSheet(); toast('Αποθηκεύτηκε: '+name);
    }catch(e){ toast('Δεν έγινε η αποθήκευση'); }
  };
}
async function projectsSheet(){
  let recs=[];
  try{ const d=await db();
    recs=await new Promise((res,rej)=>{ const t=d.transaction('p','readonly'); const q=t.objectStore('p').getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>rej(q.error); });
  }catch(e){ recs=[]; }
  if(S.owner&&S.owner!=='*') recs=recs.filter(r=>(r.owner||'')===S.owner);
  recs.sort((a,b)=>b.date-a.date);
  const rows=recs.length?recs.map(r=>`
    <div class="row">
      <div class="rowmain"><b>${r.name.replace(/</g,'&lt;')}</b>
      <span>${new Date(r.date).toLocaleString('el-GR')} · ${r.anns.length} σημάδια</span></div>
      <button class="mini" data-o="${r.id}">Άνοιγμα</button>
      <button class="mini del" data-x="${r.id}">✕</button>
    </div>`).join(''):'<p class="hint">Δεν υπάρχουν αποθηκευμένα έργα ακόμη.</p>';
  openSheet(`<h2>Αποθηκευμένα έργα</h2>${rows}<div class="acts"><button class="primary" id="prC">Κλείσιμο</button></div>`);
  $('prC').onclick=closeSheet;
  $('sheetIn').querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{
    const r=recs.find(x=>x.id===b.dataset.o);
    const url=URL.createObjectURL(r.blob); const im=new Image();
    im.onload=()=>{ setImage(im,r.blob); S.anns=r.anns||[]; S.scale=r.scale||null; S.projId=r.id; S.projName=r.name;
      draw(); scaleTag(); closeSheet(); };
    im.src=url;
  });
  $('sheetIn').querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{
    try{ const d=await db(); await new Promise(res=>{const t=d.transaction('p','readwrite');t.objectStore('p').delete(b.dataset.x);t.oncomplete=res;}); }catch(e){}
    projectsSheet();
  });
}

/* ---------- γραμμή εργαλείων ---------- */
function buildTools(){
  $('tools').innerHTML=TOOLS.map(t=>`<button class="tool" data-t="${t.k}"><svg viewBox="0 0 24 24">${t.i}</svg>${t.n}</button>`).join('');
  $('tools').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>setTool(b.dataset.t));
  $('swatches').innerHTML=COLORS.map(c=>`<span class="sw" data-c="${c}" style="background:${c}"></span>`).join('');
  $('swatches').querySelectorAll('[data-c]').forEach(s=>s.onclick=()=>{
    S.color=s.dataset.c;
    const a=S.anns.find(x=>x.id===S.sel); if(a){a.color=S.color;draw();}
    refreshOpts();
  });
}
function setTool(t){
  finishPoly();
  S.tool=t; S.sel=null; S.draft=null;
  $('tools').querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  if(t==='calib'&&S.img)toast('Τράβα γραμμή σε κάτι με γνωστό μήκος');
  if(t==='poly')toast('Πάτα σημείο-σημείο · μετά «Ολοκλήρωση»');
  if(t==='angle')toast('Τρία πατήματα: άκρη, κορυφή, άκρη');
  draw(); refreshOpts();
}
function refreshOpts(){
  $('swatches').querySelectorAll('[data-c]').forEach(s=>s.classList.toggle('on',s.dataset.c===S.color));
  $('cSnap').classList.toggle('on',S.snap);
  const hu=$('hUndo'), hr=$('hRedo');
  if(hu){ hu.classList.toggle('off',!S.undoS.length); hr.classList.toggle('off',!S.redoS.length); }
  $('cShow').classList.toggle('on',S.show);
  const ct=$('cTxt');
  if(ct){ ct.textContent='📝 Κείμενο: '+(S.noteText==='hide'?'κρυφό':S.noteText==='short'?'σύντομο':'πλήρες');
    ct.classList.toggle('on',S.noteText!=='hide'); }
  const open=S.anns.find(a=>a._open);
  const extra=$('cDel');
  extra.textContent = open ? '✅ Ολοκλήρωση' : '🗑️ Διαγραφή';
  extra.onclick = open ? (()=>{finishPoly();refreshOpts();}) : delSel;
  let cb=$('cClose');
  if(S.tool==='poly'){
    if(!cb){ cb=document.createElement('button'); cb.className='chip'; cb.id='cClose'; cb.textContent='⭕ Κλείσιμο σχήματος'; $('opts').appendChild(cb); }
    cb.onclick=()=>{closePoly();refreshOpts();};
    cb.style.display='';
  } else if(cb) cb.style.display='none';
}
function delSel(){
  if(!S.sel){toast('Διάλεξε πρώτα κάτι με το εργαλείο Επιλογή');return;}
  push(); S.anns=S.anns.filter(a=>a.id!==S.sel); S.sel=null; draw(); refreshOpts();
}

$('wRange').oninput=e=>{ S.width=+e.target.value; const a=S.anns.find(x=>x.id===S.sel); if(a){a.width=S.width;draw();} };
$('cSnap').onclick=()=>{ S.snap=!S.snap; refreshOpts(); toast(S.snap?'Γωνίες κλειδωμένες σε 0°/45°/90°':'Ελεύθερη γωνία'); };
$('cShow').onclick=()=>{ S.show=!S.show; draw(); refreshOpts(); };
$('cTxt').onclick=()=>{
  S.noteText = S.noteText==='hide'?'short':S.noteText==='short'?'full':'hide';
  try{ localStorage.setItem('fotometra-txt',S.noteText); }catch(_){}
  draw(); refreshOpts();
};
$('hUndo').onclick=undo; $('hRedo').onclick=redo;
$('cEdit').onclick=()=>{ const a=S.anns.find(x=>x.id===S.sel);
  if(!a){toast('Διάλεξε πρώτα μια μέτρηση (εργαλείο Επιλογή ή από τη Λίστα)');return;} editAnn(a); };
$('bList').onclick=listSheet; $('bMenu').onclick=menuSheet;
$('zIn').onclick=()=>zoomAt(cv._w/2,cv._h/2,1.25);
$('zOut').onclick=()=>zoomAt(cv._w/2,cv._h/2,1/1.25);
$('zFit').onclick=fitView;
cv.addEventListener('dblclick',e=>{
  if(S.tool==='poly'){ finishPoly(); return; }
  const r=cv.getBoundingClientRect(); const h=hitTest({x:e.clientX-r.left,y:e.clientY-r.top});
  if(h){ S.sel=h.a.id; draw(); editAnn(h.a); }
});

window.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault(); e.shiftKey?redo():undo();}
  if(e.key==='Delete'||e.key==='Backspace')delSel();
  if(e.key==='Enter')finishPoly();
});

new ResizeObserver(fitCanvas).observe($('stage'));
try{ if(navigator.storage&&navigator.storage.persist)navigator.storage.persist(); }catch(_){}
try{ S.autoDev=!!localStorage.getItem('fotometra-autodev'); }catch(_){}
try{ const t=localStorage.getItem('fotometra-txt'); if(t)S.noteText=t; }catch(_){}
buildTools(); setTool('select'); fitCanvas(); refreshOpts();
if(QP.get('title')) document.querySelector('#top h1').textContent=QP.get('title');
if(EMBED){
  $('bDone').style.display='flex';
  try{ parent.postMessage({type:'fotometra-ready'},'*'); }catch(_){}
  $('bDone').onclick=async()=>{ await autoSave(); try{parent.postMessage({type:'fotometra-close'},'*');}catch(_){} };
  (async()=>{
    try{
      const d=await db();
      const all=await new Promise((res,rej)=>{ const t=d.transaction('p','readonly'); const q=t.objectStore('p').getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>rej(q.error); });
      const mine=(S.owner&&S.owner!=='*')?all.filter(r=>(r.owner||'')===S.owner):all;
      if(mine.length) projectsSheet(); else $('fCam').click();
    }catch(e){}
  })();
} else restoreLast();
(async()=>{ try{ if(window.claude&&window.claude.use) dl=await window.claude.use('downloads'); }catch(_){}
})();

/* ---------- εγκατάσταση ως εφαρμογή ---------- */
const APPV='1.9.2';
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; $('bInstall').style.display='flex'; });
window.addEventListener('appinstalled',()=>{ deferredPrompt=null; $('bInstall').style.display='none'; toast('Εγκαταστάθηκε'); });
function doInstall(){
  if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.finally(()=>{deferredPrompt=null;$('bInstall').style.display='none';}); return; }
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent);
  openSheet(`<h2>Εγκατάσταση</h2><p class="hint">${ios
    ? 'Στο iPhone: πάτα το κουμπί «Κοινή χρήση» κάτω στον Safari και μετά «Προσθήκη στην οθόνη Αφετηρίας».'
    : 'Στο Android: άνοιξε το μενού ⋮ του φυλλομετρητή και πάτα «Εγκατάσταση εφαρμογής» ή «Προσθήκη στην αρχική οθόνη». Αν δεν εμφανίζεται, ξαναφόρτωσε τη σελίδα και ξαναδοκίμασε.'}</p>
    <div class="acts"><button class="primary" id="iC">Εντάξει</button></div>`);
  $('iC').onclick=closeSheet;
}
$('bInstall').onclick=doInstall;
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
